name: Dienos renginio generavimas

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Paimti failus
        uses: actions/checkout@v4

      - name: Paruošti Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Įdiegti bibliotekas
        run: pip install requests

      - name: Paleisti DI redakciją ir SEO generatorių
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: atnaujinti_paveikslelius.py

      - name: Išsaugoti naują straipsnį, paveikslėlį ir SEO failus
        run: |
          git config --local user.email "bot@vilniauspulsas.lt"
          git config --local user.name "DI Redakcija"
          git add articles.json images/ straipsniai/ sitemap.xml robots.txt
          git commit -m "Naujas dienos renginys ir SEO atnaujinimas" || exit 0
          git push
